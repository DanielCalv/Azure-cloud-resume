name: Deploy to Azure Storage Static Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload site files to Azure Storage ($web container)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload --overwrite \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name '$web' \
              --name index.html \
              --file index.html

            az storage blob upload --overwrite \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name '$web' \
              --name styles.css \
              --file styles.css

            az storage blob upload --overwrite \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name '$web' \
              --name script.js \
              --file script.js
